[package]
name = "sparq-host-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The instrument host (WO-018): the five-file package model, drop-in discovery, the hand-in gate's static stages, and the gpu_class ceiling table"

[dependencies]
# The contract crate is the only dependency of the static half. Everything here — package model,
# discovery, ceilings, the validator's stages 1/2/5-static/7 — runs with zero third-party crates,
# which is what lets acceptance criterion 2 ("default `cargo test --workspace` passes with the
# feature off") mean something: the gate is testable on a runner that will never host a sandbox.
sparq-module-api.workspace = true

# WO-020 (ADR-011): the stream registry, so stage 1 can resolve a `ui.displays[].sources[].stream`
# binding against `streams.toml` (the single source of truth for stream ids) and refuse an unknown id
# with `E-STREAM-UNKNOWN`. sparq-streams' DEFAULT build is zero third-party deps (its registry rides
# sparq-module-api's TOML subset parser; serde_json is behind its `streams` feature, which the
# validator does NOT enable), so the static half stays zero-dependency.
sparq-streams.workspace = true

# wasmtime rides the `instrument-host` feature and nothing else (ADR-010's consequence: feature-
# gated exactly like egui/wgpu). Exact-pinned at the workspace level; see the root Cargo.toml for
# the rationale. The runtime half (loader, fuel, hot reload, stages 3/4/6) lands behind this
# feature — `docs/instrument-host.md` carries the design and the test plan.
wasmtime = { workspace = true, optional = true }

[features]
default = []
# The wasm runtime. OFF by default: the zero-dependency core build, the CI default cells and
# every golden stay untouched without it.
instrument-host = ["dep:wasmtime"]
# The hermetic sources door (WO-020 INC4 §8.3): ReplayProvider — fixture windows served through
# the same binding-resolution the device's BrokerProvider (INC5, `streams-net`) will wear. Pulls
# sparq-streams' serde_json half; the default build stays zero-dependency.
streams = ["sparq-streams/streams"]

[lints]
workspace = true
