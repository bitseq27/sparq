[package]
name = "sparq-streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sparq stream plane's broker (WO-020 / ADR-011): the checked-in stream registry, the frozen-vocabulary normalizers, rolling windows, the disk cache and fixture replay — the hermetic half that never touches the network"

# The hermetic half of the broker is dependency-free by default (ADR-008 / the zero-dep promise):
# the registry rides sparq-module-api's hand-rolled TOML subset parser, and the data model, the
# windows and the stale policy are pure std. serde_json — the first third-party dependency — is
# pulled only by the `streams` feature, which turns on the JSON/GeoJSON/CSV normalizers, the disk
# cache, fixture replay and the broker's scheduling core. The live transport (ureq + TLS,
# `fetch.rs`'s `HttpTransport`) rides `streams-net` — landed with WO-020 INC5; without it every
# network verb refuses in words.
[dependencies]
sparq-module-api = { workspace = true }
serde_json = { workspace = true, optional = true }
# INC5: the live transport. ureq is blocking and minimal (no async runtime), rustls + webpki-roots
# so the trust store rides the binary identically on the sandbox and on SATURN. Optional and
# behind `streams-net`; the hermetic half and the default build never compile it.
ureq = { workspace = true, optional = true }

[features]
default = []
# The hermetic data half: normalizers (JSON/GeoJSON/CSV/text -> frozen data-records), the disk
# cache and fixture replay. One dependency (serde_json). Everything the sandbox can prove lives
# here; goldens and tests run from recorded fixtures, never from a socket (the determinism
# firewall, plan D11).
streams = ["dep:serde_json"]
# The live transport half (ureq + TLS + `fetch.rs`). Declared so the feature surface is stable and
# the CLI can key its refusals on it. INC5 landed the transport: with this feature on, `probe
# --live`, `fetch` and `tail` really reach the network (and the broker's `HttpTransport` exists);
# with it off, every network verb still refuses in words — the refusal surface did not move, only
# what sits behind it.
streams-net = ["streams", "dep:ureq"]

[lints]
workspace = true
