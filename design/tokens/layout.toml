# sparq design tokens — space, layout, strokes, touch
# Version 0.1.0

[meta]
schema = "sparq.tokens.layout"
version = "0.1.0"

# ---------------------------------------------------------------- spacing (8px base, 4px fine)
[space]
"0" = 0
"1" = 4
"2" = 8        # base unit
"3" = 12
"4" = 16
"5" = 24
"6" = 32
"7" = 48
"8" = 64
"9" = 96
gutter = 16    # between panels
padding_panel = 16
padding_section = 24

# ---------------------------------------------------------------- strokes & corners
[stroke]
hairline = 1     # structure: borders, dividers, grid, inactive wires
signal   = 2     # active signal path
emphasis = 3     # selection frame, primary trace in a full-bleed visual
hero     = 4     # Perform-mode transport/panic glyphs only
widths_allowed = [1, 2, 3, 4]  # 4 is reserved for Perform-mode hero glyphs only (transport icons at 96px+);
                               # Design mode is restricted to {1,2,3}. Any other width is a build error.

[corner]
none   = 0       # default for widgets, fields, meters, canvas objects
micro  = 2       # buttons, chips
panel  = 4       # panels, dialogs, dock
max    = 4       # nothing is rounder than this; circles only for knobs and ports

[elevation]
# There is no shadow system. Depth is expressed by:
#   1. ground tint (canvas < ground < panel < panel_alt < overlay)
#   2. hairline opacity tier (faint < regular < strong)
#   3. draw order + a 1px inner top highlight at 6% white on overlays only
shadow = "forbidden"
overlay_opacity = 0.95

# ---------------------------------------------------------------- touch & hit areas (non-negotiable)
[touch]
min_target          = 44     # px; every interactive element. Enforced by the layout audit in CI
min_target_dense    = 32     # px; allowed only in Design mode, only for non-destructive controls, badged in the audit
target_s            = 44
target_m            = 56
target_l            = 72
target_xl           = 96     # Perform-mode macro pads (min 96, typical 120-160)
port_radius         = 6      # drawn radius
port_capture_radius = 24     # grab radius for connecting wires
wire_hit_width      = 20     # invisible hit area around a wire
row_height_list     = 44     # dense table rows in the browser
row_height_browser  = 56
gesture.long_press_ms       = 350
gesture.double_tap_ms       = 300
gesture.pinch_min_span_px   = 40
gesture.fine_resolution_factor = 10   # second finger down during a drag
gesture.palm_reject_max_contact_area_mm2 = 100
stage.min_macro_pad = 96
stage.visible_at_3m_px = 44     # minimum glyph height for anything read at 3 m in Perform mode

# ---------------------------------------------------------------- shell layout
[shell]
rail_width          = 56
rail_button         = 44
top_bar_height      = 48
dock_height         = 260
dock_height_min     = 120
dock_height_max     = 520
dock_card_w         = 112      # the module palette tile (increment 4: smaller, grouped, coloured
dock_card_h         = 56       # class M floor (56 px shorter side); two rows fit the default dock
library_width       = 240      # the NODE LIBRARY sidebar (PN convergence, inc 6)
library_card_h      = 32       # one library tile (operator ruling 2026-10-01: compact — colour ref + name only)
toolbar_height      = 32       # the canvas toolbar row (fit/arrange/zoom/wire style/counts)
inspector_width     = 400
inspector_width_min = 320
inspector_width_max = 560
panel_header_height = 40
status_bar_height   = 0        # diagnostics live in the rail + top bar; no bottom status bar in Perform mode

# ---------------------------------------------------------------- canvas
[canvas]
grid_minor          = 32       # dot grid
grid_major          = 256      # brighter dot / hairline cross
grid_dot_radius     = 1
grid_dot_opacity    = 0.08
snap                = 8
node_width_default  = 240
node_width_min      = 160
node_width_max      = 480
# WO-020 (ADR-011 / plan D6): the INSTRUMENT-layer card ceiling. The backbone's 480 ceiling above is
# untouched — a wall-class instrument (the Observatory) is a different animal and sizes its card from
# its display's own min_size, not the backbone grid. Sizing rule (the layout audit enforces it):
#   card = display.min_size + chrome, where chrome = space.gutter each side (16) + node_header_height
#   (32) + the panel band (rows × touch.target_s + gaps) + the port band (0 for a port-less
#   instrument, D5). The Observatory declares min_size = [2176, 1120] → card ≈ 2208 × 1288 world px,
#   which at the 2560×1600 reference covers ≥ 95% of the canvas-rect width at zoom 1.0 (audit row).
# Moving this ceiling needs an operator ruling (it is a wall-class contract, not a taste knob).
node_width_instrument_max = 2400
node_header_height  = 32
node_port_row       = 48       # >= 2 x touch.port_capture_radius, so capture circles on one edge never overlap
node_param_row      = 32       # inline parameter row on the node card (PN convergence, inc 6);
                               # the dense touch floor exactly, at zoom 1 — badged, non-destructive
node_param_rows_max = 8        # rows drawn on the card before the "+N MORE" word (the inspector keeps all)
node_well_height    = 48       # the inset display band (scope, meters, envelope, sparkline, curve)
node_well_height_scope = 160   # the scope display is BIGGER (operator ruling 2026-10-01): a reading you can measure
node_info_height    = 40       # the out/main driver-info band (negotiated device truth, operator ruling 2026-10-01)
node_port_offset    = 6        # ports float this far OUTSIDE the card edge (operator ruling 2026-10-01; widened 4→6 in round 4, D10 — the port must read as its own furniture at arm's length)
node_radius         = 2
zoom_min            = 0.25
zoom_max            = 1.0    # operator ruling 2026-10-01 r3: never zoom past 100 %
zoom_default        = 1.0
zoom_step           = 1.2
lod_levels          = 3        # 0 full panel detail, 1 simplified, 2 colour-coded dot
lod_1_below_zoom    = 0.6
lod_2_below_zoom    = 0.35
wire_style          = "bezier-horizontal"   # control point offset = 0.5 * horizontal distance
wire_crossing_policy = "no bridges; crossings are drawn plain (data-ink)"

# ---------------------------------------------------------------- breakpoints (logical px)
[breakpoint]
tablet_min   = { w = 1280, h = 800 }    # touch-primary stage device
laptop_min   = { w = 1440, h = 900 }
large_min    = { w = 2560, h = 1440 }   # display wall / projector
# Rules: below tablet_min the app refuses to run in Design mode (Perform mode still works, reflowed).
# Rail and inspector collapse first; the canvas always keeps >= 60% of the width.
