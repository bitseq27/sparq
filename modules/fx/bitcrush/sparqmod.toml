# sparq module manifest — fx/bitcrush (WO-014 increment 2).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
# Deliberate aliasing as a FEATURE (the WO's own words): the rate reduction images are the sound.
# The optional anti-alias one-pole is there for when the user wants the crush without the images,
# and the dither PRNG is seeded from state so a crush is independently reproducible.

[identity]
id = "sparq/fx/bitcrush"
version = "0.1.0"
host_api = { min = 1, max = 1 }
display_name = "Bitcrush"
summary = "Depth and rate reduction with dither - aliasing as a feature"
authors = ["sparq"]
license = "MIT"

[classification]
category = "fx/distortion/bitcrush"
top = "fx"
kind = "processor"
tier = "t1"
stability = "stable"

[[ports]]
id = "in"
name = "Input"
direction = "in"
type = "audio"
channel_set = "stereo"

[[ports]]
id = "out"
name = "Output"
direction = "out"
type = "audio"
channel_set = "stereo"

[[params]]
id = "depth"
name = "Depth (bits)"
type = "int"
unit = "x"
min = 1.0
max = 16.0
default = 8.0

[[params]]
id = "rate_div"
name = "Rate divider"
type = "int"
unit = "x"
min = 1.0
max = 64.0
default = 4.0

[[params]]
id = "anti_alias"
name = "Anti-alias"
type = "float"
unit = "ratio"
min = 0.0
max = 1.0
default = 0.0

[[params]]
id = "dither"
name = "Dither"
type = "bool"
default = 1.0

[state]
schema_id = "sparq/fx/bitcrush/state"
schema_version = 1

[resources]
latency = 0
cpu_class = "trivial"
