# sparq module manifest — fx/fold (operator round 4 2026-10-02, D8).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
#
# The wavefolder the operator asked for ("fold module"): the signal is multiplied into a
# drive and folded back at the ±1 rails with triangular periodicity — the harmonic bloom of
# a folded sine, the classic West-Coast shaper, as a memoryless function.
#
# SEMANTICS, stated exactly:
# * `out = fold_tri(in * drive)` per sample per channel, with `drive = 1 + 7 * amount`
#   (amount 0..1 → drive 1..8, so the ceiling is three and a half full folds — audible
#   density without leaving the musical range).
# * `fold_tri` folds into −1..1 with period 4: `y = ((x + 1) mod 4) − 1`; `|y| <= 1` passes,
#   `y > 1` reflects as `2 − y` (the triangle's descending leg). The fold points are the odd
#   integers ±1, ±3, …; the function is continuous everywhere and odd-symmetric.
# * `amount = 0` is drive 1 and takes the IDENTITY BRANCH: a straight buffer copy, bit-exact
#   (the house rule for every "off" — an untouched fold is a wire, which its golden pins).
# * Memoryless: the state blob is empty and says so — a save/restore cannot change a sample.

[identity]
id = "sparq/fx/fold"
version = "0.1.0"
host_api = { min = 1, max = 1 }
display_name = "Fold"
summary = "Triangular wavefolder: drive into ±1 rails, harmonics out - amount 0 is a bit-exact wire"
authors = ["sparq"]
license = "MIT"

[classification]
category = "fx/distortion/wavefolder"
top = "fx"
kind = "processor"
tier = "t1"
stability = "stable"

[[ports]]
id = "in"
name = "Input"
direction = "in"
type = "audio"
channel_set = "stereo"

[[ports]]
id = "out"
name = "Output"
direction = "out"
type = "audio"
channel_set = "stereo"

# 0 = bit-exact passthrough (the identity branch); 1 = drive ×8, the densest fold.
[[params]]
id = "amount"
name = "Amount"
type = "float"
unit = "ratio"
min = 0.0
max = 1.0
default = 0.0

[state]
schema_id = "sparq/fx/fold/state"
schema_version = 1

[resources]
latency = 0
cpu_class = "trivial"
