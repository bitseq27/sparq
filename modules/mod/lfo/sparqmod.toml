# sparq module manifest — mod/lfo (WO-014 increment 4).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
#
# The first `mod`-family module — the taxonomy family defect #84 added to the closed TOPS
# domain precisely so this manifest could declare its own top.
#
# RANGE DECISION, stated where it is visible: the output is UNIPOLAR (0..1). A bipolar LFO is
# the modular convention, but the compat matrix REFUSES a bipolar → unipolar wire rather than
# silently rescaling it (G2 — "nothing invisible happens to the sound"), and the converter it
# names (`util/range`) is Phase 1 and not built. A bipolar port today would be a module that
# cannot connect to a single shipped consumer; a unipolar one modulates `flt/svf`'s
# `cutoff-mod` out of the box. When `util/range` ships, a bipolar sibling (or a `bipolar`
# port on a 0.2.0 of this module, additively) is a small increment — declared here so the
# choice is a decision on the record, not an accident.
#
# TRANSPORT SYNC — two mechanisms, both shipped:
#  * the `sync` EVENT input resets the phase at the event's exact sample (sample-accurate, from
#    increment 4 — the transport's beat/bar triggers ARE the clock, WO-009 emits them); and
#  * BEAT-LOCKED RATE (0.2.0, the WO-014 increment-5 decision realised): with `sync-mode` = 1 the
#    rate is `division` cycles per beat, derived module-side from the block-start tick the executor
#    already carries (`bpm = Δtick/ppqn/Δseconds×60`) — NOT a per-frame tick view, which would have
#    been a contract change through every implementor and the api_snapshot pins. A tempo edit lands
#    one block late (1.3 ms at 96 kHz/64), the declared and measured cost of that choice. With no
#    transport feeding a tick, beat-lock falls back to the free-running `rate` so it never stops.

[identity]
id = "sparq/mod/lfo"
version = "0.2.0"
host_api = { min = 1, max = 1 }
display_name = "LFO"
summary = "Low-frequency oscillator - four shapes, event phase-reset, beat-lock, unipolar cv"
authors = ["sparq"]
license = "MIT"

[classification]
category = "modulation/lfo"
top = "mod"
kind = "source"
tier = "t1"
stability = "stable"

[[ports]]
id = "sync"
name = "Sync"
direction = "in"
type = "event"
event_kinds = ["trigger", "clock"]
required = false

[[ports]]
id = "out"
name = "Out"
direction = "out"
type = "cv"
rate = "audio"
range = "unipolar"

[[params]]
id = "rate"
name = "Rate"
type = "float"
unit = "Hz"
min = 0.05
max = 50.0
default = 1.0

# 0 sine · 1 triangle · 2 saw · 3 square — mapped into 0..1 (see the header's range decision).
[[params]]
id = "shape"
name = "Shape (0 sine 1 tri 2 saw 3 sqr)"
type = "int"
unit = "x"
min = 0.0
max = 3.0
default = 0.0

[[params]]
id = "depth"
name = "Depth"
type = "float"
unit = "ratio"
min = 0.0
max = 1.0
default = 1.0

# 0 = free-running at `rate` Hz; 1 = beat-locked to the transport at `division` cycles per beat.
[[params]]
id = "sync-mode"
name = "Rate Source (0 Hz 1 beat)"
type = "int"
unit = "x"
min = 0.0
max = 1.0
default = 0.0

# Cycles per beat when sync-mode = 1 (0.25 = one cycle per 4 beats, 1 = one per beat, 2 = two per
# beat). Ignored in Hz mode. A tempo edit reaches it one block late (the header's declared lag).
[[params]]
id = "division"
name = "Cycles per Beat"
type = "float"
unit = "x"
min = 0.0
max = 16.0
default = 1.0

[state]
# The state blob is exactly 8 bytes: the f64 phase, like syn/sine — a project save/restore
# lands phase-continuous.
schema_id = "sparq/mod/lfo/state"
schema_version = 1

[resources]
latency = 0
cpu_class = "trivial"
