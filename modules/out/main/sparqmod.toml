# sparq module manifest — out/main (WO-014 increment 1).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
# This file is THE manifest: discovered from disk by `sparq modules`, compiled into the binary
# by `sparq-audio::modules` (include_str!) — one copy, two consumers, no drift.
#
# Reconstruction note (2026-10-04): this file was lost to a workspace-snapshot artefact (the
# snapshot layer excludes directories named `out`, and `modules/out/` was stripped between
# sessions). It was reconstructed field-for-field from its generated doc (`docs/modules/
# out-main.md` — which `tools/module_docs.py --check` proves byte-identical to what the
# original manifest renders) and the house conventions of its WO-014 siblings. Comments are
# the only bytes that may differ from the original; every parsed value is machine-verified
# by the doc gate, the registry cross-check and the golden renders.

[identity]
id = "sparq/out/main"
version = "0.1.0"
host_api = { min = 1, max = 1 }
display_name = "Main Out"
summary = "Master output with trim and the metering hook - the node the listener hears"
authors = ["sparq"]
license = "MIT"

[classification]
category = "io/output/main"
top = "out"
kind = "io"
tier = "t1"
stability = "stable"

[[ports]]
id = "in"
name = "Main In"
direction = "in"
type = "audio"
channel_set = "stereo"
# The master's input is optional: an unpatched Main Out renders silence and FLAGS in the shell
# (operator ruling, WO-012 inc 5b) rather than refusing the build.
required = false

[[ports]]
id = "out"
name = "Main Out"
direction = "out"
type = "audio"
channel_set = "stereo"

[[params]]
id = "trim"
name = "Trim"
type = "float"
unit = "ratio"
min = 0.0
max = 2.0
default = 1.0

[[params]]
id = "mute"
name = "Mute"
type = "int"
unit = "x"
min = 0.0
max = 1.0
default = 0.0

[state]
schema_id = "sparq/out/main/state"
schema_version = 1

[resources]
latency = 0
cpu_class = "trivial"
