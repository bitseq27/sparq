# sparq module manifest — out/main (WO-014 increment 5).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
#
# RECONSTRUCTED 2026-09-30 (sandbox): a workspace-storage wipe destroyed the original bytes
# (sha 725bf07a…) together with the git history and the upstream clone; no snapshot, zip or
# upstream carried this file (a directory named `out` is on the snapshot exclude list). This
# copy restores every FIELD from the generated doc `docs/modules/out-main.md` (which the
# `module_docs --check` gate proves against) and from the module's own contract in
# `sparq-audio::modules` (unity-bit-exact wire, trim, hard mute, the metering hook). Only the
# prose comments are new; the sha therefore moves, and the move is declared in SYNC.md and
# CHECKLIST.md rather than hidden — the stamp's cross-machine contract stays honest.
# RE-RESTORED 2026-10-01 (round 3): the same exclude-list wipe took the directory again in the
# sandbox; restored byte-identical to the round-2 state (stereo input, see below).
#
# The master output: a unity-BIT-EXACT pass-through with a trim and a hard mute that writes
# EXACT zeros. Because the executor meters every node, this node's peak/rms ARE the master
# meters — the "metering hook". The input is STEREO (operator ruling 2026-10-01 round 2: the
# master is a stereo device door in both directions; a mono source still lands through the
# documented mono→stereo conversion); the output is stereo, the v0 device target.

[identity]
id = "sparq/out/main"
version = "0.1.0"
host_api = { min = 1, max = 1 }
display_name = "Main Out"
summary = "Master output with trim and the metering hook - the node the listener hears"
authors = ["sparq"]
license = "MIT"

[classification]
category = "io/output/main"
top = "out"
kind = "io"
tier = "t1"
stability = "stable"

[[ports]]
id = "in"
name = "Main In"
direction = "in"
type = "audio"
# Operator ruling 2026-10-01 (round 2): the master is a STEREO device door in both directions
# (was `variable`); a mono source still lands through the documented mono→stereo conversion.
channel_set = "stereo"
required = false

[[ports]]
id = "out"
name = "Main Out"
direction = "out"
type = "audio"
channel_set = "stereo"

[[params]]
id = "trim"
name = "Trim"
type = "float"
unit = "ratio"
min = 0.0
max = 2.0
default = 1.0

[[params]]
id = "mute"
name = "Mute"
type = "int"
unit = "x"
min = 0.0
max = 1.0
default = 0.0

[state]
schema_id = "sparq/out/main/state"
schema_version = 1

[resources]
latency = 0
cpu_class = "trivial"
