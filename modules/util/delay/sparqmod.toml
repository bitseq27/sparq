# sparq module manifest — util/delay (WO-014 increment 2; tempo-sync in increment 5).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
# The latency declaration is PARAMETRIC ("param:time"): the wet path delays by `time`, the dry
# path by zero, and a mixed delay has no single static number — so the manifest promises the
# parameter it follows instead of a constant, which is exactly what the parametric form exists
# for (ValidatedManifest::latency_is_parametric; check_declared_latency respects it).
#
# TEMPO-SYNC (0.2.0, the WO-014 increment-5 decision realised): with `tempo-sync` = 1 the delay
# time is `division` beats, derived module-side from the block-start tick (`bpm = Δtick/ppqn/
# Δseconds×60`) and applied through `DelayLine::set_tempo_sync` — the once-unreachable DSP path,
# now reached. No clock enters the context and no contract changes; a tempo edit lands one block
# late (declared). With no transport feeding a tick, it falls back to the `time` ms parameter, so a
# tempo-synced delay never collapses to zero. At the defaults (tempo-sync = 0) this is byte-for-byte
# the increment-2 delay, which its golden pins.
#
# SYNC INPUT (0.3.0, operator round 4 2026-10-02, D14): an OPTIONAL `sync` event-in APPENDED
# after the audio pair, whose indices 0/1 do not move (the append discipline the goldens pin).
# A trigger or clock event on it DUMPS THE TAIL at that event's exact sample: both lines' stored
# memory is cleared sample-accurately through the frame-walk (`stereo_tick_f`), so a synced
# re-entry starts clean instead of bleeding the previous repeats. Gate-OFF events (value <= 0)
# are ignored — the counting rule `mod/seq` and `mod/clk-div` already hold: only a rising
# trigger dumps. With nothing wired to `sync` (the default) the delay is byte-for-byte the
# 0.2.0 module, because the dump is driven entirely by events that are not there.

[identity]
id = "sparq/util/delay"
version = "0.3.0"
host_api = { min = 1, max = 1 }
display_name = "Delay"
summary = "Tempo-syncable feedback delay with damping, dry/wet mix and a tail-dump sync input"
authors = ["sparq"]
license = "MIT"

[classification]
category = "utility/delay"
top = "util"
kind = "processor"
tier = "t1"
stability = "stable"

[[ports]]
id = "in"
name = "Input"
direction = "in"
type = "audio"
channel_set = "stereo"

[[ports]]
id = "out"
name = "Output"
direction = "out"
type = "audio"
channel_set = "stereo"

# 0.3.0 (round 4, D14) — APPENDED: a rising trigger/clock here dumps both lines' tails at the
# event's sample. Optional: an unwired sync leaves the delay exactly the 0.2.0 module.
[[ports]]
id = "sync"
name = "Sync"
direction = "in"
type = "event"
event_kinds = ["trigger", "clock"]
required = false

[[params]]
id = "time"
name = "Time"
type = "float"
unit = "ms"
min = 1.0
max = 2000.0
default = 250.0

[[params]]
id = "feedback"
name = "Feedback"
type = "float"
unit = "ratio"
min = 0.0
max = 0.95
default = 0.3

[[params]]
id = "damp"
name = "Damping"
type = "float"
unit = "ratio"
min = 0.0
max = 1.0
default = 0.5

[[params]]
id = "mix"
name = "Mix"
type = "float"
unit = "ratio"
min = 0.0
max = 1.0
default = 0.5

# 0 = `time` in ms; 1 = beat-locked at `division` beats, derived from the transport tick.
[[params]]
id = "tempo-sync"
name = "Tempo Sync (0 ms 1 beat)"
type = "int"
unit = "x"
min = 0.0
max = 1.0
default = 0.0

# Delay time in beats when tempo-sync = 1 (0.25 = a sixteenth, 0.5 = an eighth, 1 = a quarter,
# 1.5 = a dotted quarter). Ignored in ms mode.
[[params]]
id = "division"
name = "Division (beats)"
type = "float"
unit = "x"
min = 0.0
max = 16.0
default = 0.5

[state]
schema_id = "sparq/util/delay/state"
schema_version = 1

[resources]
latency = "param:time"
cpu_class = "light"
