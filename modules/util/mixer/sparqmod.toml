# sparq module manifest — util/mixer (WO-014 increment 3).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
#
# The 4×4 stereo matrix with per-cell gain — the explicit merge the connection rules require
# (audio fan-in sums HERE, in a module the patch can see, never silently in the host). Contract
# stress per WO-014: "channel sets, multichannel readiness" — eight audio ports, the first
# multi-port first-party module, riding contract v1's take_* output pattern.
#
# Why 4×4 and not 8×8: the parameter snapshot cap is 32 (MAX_PARAMS), and 16 cells + 4 output
# trims = 20 of them. A wider matrix waits for the cap to move — declared, not discovered.
# The cv fan-in refusal also names this module; its AUDIO side ships here, and the cv merge side
# (cv inputs summing to a cv output) is declared open in LATER.md rather than faked.

[identity]
id = "sparq/util/mixer"
version = "0.1.0"
host_api = { min = 1, max = 1 }
display_name = "Mixer"
summary = "4x4 stereo matrix with per-cell gain - the explicit merge, never implicit summing"
authors = ["sparq"]
license = "MIT"

[classification]
category = "utility/mixer"
top = "util"
kind = "processor"
tier = "t1"
stability = "stable"

[[ports]]
id = "in-0"
name = "Input 1"
direction = "in"
type = "audio"
channel_set = "stereo"
required = false

[[ports]]
id = "in-1"
name = "Input 2"
direction = "in"
type = "audio"
channel_set = "stereo"
required = false

[[ports]]
