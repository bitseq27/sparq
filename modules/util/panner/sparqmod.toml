# sparq module manifest — util/panner (WO-014 increment 2).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
# The spatial precursor: mono in, stereo out, two laws. A stereo BALANCE mode (stereo in) waits
# for multi-port AudioCtx (contract v1) and is declared absent rather than faked.

[identity]
id = "sparq/util/panner"
version = "0.1.0"
host_api = { min = 1, max = 1 }
display_name = "Panner"
summary = "Mono-to-stereo panner with equal-power and linear laws"
authors = ["sparq"]
license = "MIT"

[classification]
category = "utility/pan"
top = "util"
kind = "spatial"
tier = "t1"
stability = "stable"

[[ports]]
id = "in"
name = "Input"
direction = "in"
type = "audio"
channel_set = "mono"

[[ports]]
id = "out"
name = "Output"
direction = "out"
type = "audio"
channel_set = "stereo"

[[params]]
id = "pan"
name = "Pan"
type = "float"
unit = "%"
min = 0.0
max = 100.0
default = 50.0

[[params]]
id = "law"
name = "Law (0 equal-power 1 linear)"
type = "int"
unit = "x"
min = 0.0
max = 1.0
default = 0.0

[state]
schema_id = "sparq/util/panner/state"
schema_version = 1

[resources]
latency = 0
cpu_class = "trivial"
