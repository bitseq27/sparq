# sparq module manifest — util/vca (operator round 2026-10-01 r3; cv range moved in round 4).
# Schema: docs/api/manifest-schema.md · field domains: docs/api/manifest-fields.toml.
#
# The voltage-controlled amplifier the operator asked for: an audio path whose gain is the
# SUM of a knob and a control voltage — the classic modulation junction (envelope or LFO
# in, shaped audio out).
#
# ROUND 4 (2026-10-02, D7 — the operator's ruling): the cv input's declared range moves
# BIPOLAR → UNIPOLAR. Every first-party cv SOURCE publishes unipolar (lfo, env, rms, the
# clock family), so a bipolar declaration made the manifest refuse the very wires the
# patch is built from ("vca will not take the lfo"). The compatibility matrix itself does
# NOT move (cell G2 stands): the manifest now tells the truth about what modulates this
# module, and the verdict follows the truth. `util/range` (the explicit converter) stays
# Phase-1 work — a genuinely bipolar source is that module's job, not a mismatched pin here.
#
# SEMANTICS, stated exactly:
# * `out = in * (level + cv)`, where `cv` is the unipolar control input read at block rate
#   (the cv-in discipline of `util/gain`'s family): the knob is the bias, the wire is the
#   motion, and with no wire the VCA is exactly the knob's amplifier. A 0..1 cv sweeps the
#   gain from `level` to `level + 1`; negative motion is `util/range`'s future job.
# * The product rides the same one-pole glide discipline as the other gain-like coefficients
#   (defect #85): a fast cv or a fast knob chase instead of stepping, and a settled signal is
#   the exact constant multiply the goldens pin.
# * The cv input is OPTIONAL (required = false): an unwired cv reads 0, so a bare VCA is a
#   legal patch shape (the out/main input's precedent), not a flagged one.

[identity]
id = "sparq/util/vca"
version = "0.2.0"
host_api = { min = 1, max = 1 }
display_name = "VCA"
summary = "Voltage-controlled amplifier: audio gain = knob + unipolar control voltage"
authors = ["sparq"]
license = "MIT"

[classification]
category = "utility/vca"
top = "util"
kind = "processor"
tier = "t1"
stability = "stable"

[[ports]]
id = "in"
name = "Audio In"
direction = "in"
type = "audio"
channel_set = "stereo"

[[ports]]
id = "cv"
name = "Control In"
direction = "in"
type = "cv"
rate = "audio"
range = "unipolar"
required = false

[[ports]]
id = "out"
name = "Audio Out"
direction = "out"
type = "audio"
channel_set = "stereo"

[[params]]
id = "level"
name = "Level"
type = "float"
unit = "ratio"
min = 0.0
max = 2.0
default = 1.0

[state]
schema_id = "sparq/util/vca/state"
schema_version = 1

[resources]
latency = 0
cpu_class = "trivial"
