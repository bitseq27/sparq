# sparq instrument template — manifest (contract v1.1, ADR-010 / WO-017)
#
# This is file 1 of the five-file package (MODULE-BUILD-GUIDE.md §3):
#   1. sparqmod.toml      ← this file
#   2. <name>.wasm        ← built from instrument.rs (the source starter beside this file)
#   3. example.sparqpatch ← the stub beside this file
#   4. preview.svg        ← GENERATED by `sparq mod validate` — never hand-drawn, never checked in from elsewhere
#   5. README.md          ← the stub beside this file
#
# Change every `template`/`you/` id before validating. Schema: docs/api/manifest-schema.md.
# Unknown keys are a validation error; a bad manifest never loads.

[identity]
id = "you/syn/template"                # namespace/category/name — stable forever, alias table for renames
version = "0.1.0"
host_api = { min = 1, max = 1 }        # your pin; incompatible hosts refuse the load with words
display_name = "Template Instrument"
summary = "Minimal instrument proving the five-file package path"   # ≤ 120 chars
authors = ["you"]
license = "MIT"
tags = ["template"]
# signature = { key_id = "...", algorithm = "...", value = "...", signed_at = "..." }
# Unsigned is legal: the instrument loads BADGED and is disabled by default in Perform mode.

[classification]
category = "synth/template"
top = "syn"                            # fixed vocabulary: syn smp flt fx dyn ana spa seq gen harm dat io dsp util ml out
kind = "source"
tier = "t2"                            # instruments run in the wasm sandbox
layer = "instrument"                   # ← the field that makes it an instrument (ADR-010)
stability = "experimental"

# --- ports: typed, closed vocabulary (audio cv event data gpu atom) -------------------

[[ports]]
id = "out"
name = "Output"
direction = "out"
type = "audio"
channel_set = "mono"

[[ports]]
id = "gate"
name = "Gate"
direction = "in"
type = "event"
event_kinds = ["trigger", "gate", "note"]

# --- params: the panel binds to these; modulation targets are universal ---------------

[[params]]
id = "freq"
name = "Frequency"
type = "float"
unit = "Hz"
min = 10.0
max = 10000.0
default = 440.0
curve = "exp"                          # log-mapped: the UI slider tracks where the ear lives

[[params]]
id = "amp"
name = "Amplitude"
type = "float"
unit = "ratio"
min = 0.0
max = 1.0
default = 0.5
smoothing = "one_pole:25"              # gain-like coefficients glide (defect #85's rule)

[[params]]
id = "shape"
name = "Shape"
type = "float"
unit = "ratio"
min = 0.0
max = 1.0
default = 0.0

[state]
schema_id = "you/syn/template/state"
schema_version = 1

# --- UI: structure is yours, appearance is the host's (MODULE-BUILD-GUIDE.md §2) -------

[ui]
colour_class = "syn"                   # accent comes from the signal/category class — never from taste

[[ui.panel.widgets]]
kind = "slider"                        # closed vocabulary: slider knob xy_pad matrix enum_select
param = "freq"                         #   toggle numeric_entry label meter_attach display_slot
x = 0                                  #   button waveview grid_pad
y = 0
w = 8
h = 1
touch_class = "L"                      # S|M|L|XL — the shell refuses to render below the declared minimum

[[ui.panel.widgets]]
kind = "slider"
param = "amp"
x = 0
y = 1
w = 8
h = 1
touch_class = "L"

[[ui.displays]]                        # v1.1: host-rendered graphical display (ADR-010)
id = "view"
kind = "display_list"                  # display_list (2D) | scene (3D: camera/points/lines/mesh/heightfield)
min_size = [160, 96]
lod = "auto"
# Styling inside the emitted list is TOKEN-SEMANTIC ONLY: `color.signal.audio`, `stroke.hairline`,
# `space.4`. A literal colour/size/duration anywhere is E-LITERAL-APPEARANCE at validation.

# --- resources and capabilities: enforced for T2, not advisory -------------------------

[resources]
latency = 0
cpu_class = "trivial"                  # trivial|light|medium|heavy|very_heavy
gpu_class = "none"                     # scene-data budget class the renderer schedules against

[capabilities]
fs_read = []                           # asset scopes only; large assets are referenced by hash:
# [[state.assets]]
# role = "wavetable"
# hash = "blake3:…"                     # fetched from the content-addressed library on first load
network = "none"
max_fuel = 1_000_000                   # per block — the watchdog budget; exceeding it auto-bypasses
max_memory_mb = 32

[distribution]
package_format = "wasm"
entrypoint = "template.wasm"
platforms = ["any"]
arch = ["wasm32"]
min_host_version = "0.0.0-phase0"
channel = "beta"
